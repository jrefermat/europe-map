<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WWII European Theater Map</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-6">

  <header class="text-center my-2 max-w-2xl">
    <h1 class="text-3xl font-bold tracking-wide text-slate-100">WWII European Theater Map</h1>
    <div id="stage-title" class="mt-2 text-xl font-semibold text-blue-400"></div>
    <p id="stage-desc" class="text-slate-400 text-sm mt-1"></p>
  </header>

  <div class="w-full max-w-5xl bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl relative" style="height: 520px;">
    <div id="map" class="w-full h-full"></div>

    <div class="absolute bottom-4 left-4 z-[1000] bg-slate-900/90 backdrop-blur-md p-3 rounded-lg border border-slate-700 text-xs flex gap-4 shadow-md">
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-500"></span> Axis Occupation</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-500"></span> Allied Control / USSR</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-500"></span> Neutral</div>
    </div>
  </div>

  <div class="w-full max-w-4xl bg-slate-800 p-5 rounded-2xl border border-slate-700 mt-4 shadow-lg">
    <div class="flex justify-between items-center mb-3">
      <label for="snapshot-slider" class="text-sm font-semibold text-slate-300">European Theater Timeline (1939 – 1945)</label>
      <div class="flex items-center gap-2">
        <span id="stage-counter" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full font-mono"></span>
        <span id="stage-date" class="text-xs bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full font-mono font-bold border border-blue-500/30"></span>
      </div>
    </div>

    <input id="snapshot-slider" type="range" min="0" max="8" value="3" class="w-full accent-blue-500 cursor-pointer h-2 bg-slate-700 rounded-lg appearance-none"/>
  </div>

  <script>
    const SOVIET_OCCUPIED_POLYGONS = {
      2: [[70.0, 28.0], [59.5, 23.5], [58.5, 25.0], [56.5, 25.0], [54.0, 26.0], [51.5, 25.5], [48.0, 27.5], [46.5, 29.5], [42.0, 29.5], [42.0, 28.0], [70.0, 28.0]],
      3: [[70.0, 30.0], [59.93, 30.31], [58.50, 32.50], [56.85, 35.90], [56.33, 36.72], [54.19, 37.61], [52.80, 38.00], [51.67, 39.18], [48.80, 40.20], [47.23, 39.70], [46.50, 37.50], [42.00, 33.50], [42.00, 28.00], [70.0, 28.0]],
      4: [[70.0, 30.0], [59.93, 30.31], [57.00, 33.50], [56.00, 34.50], [53.00, 35.00], [51.50, 36.50], [48.70, 44.51], [43.60, 42.00], [42.00, 42.00], [42.00, 28.00], [70.0, 28.0]],
      5: [[70.0, 28.0], [59.50, 28.00], [56.00, 29.00], [55.00, 30.50], [53.50, 30.00], [50.40, 30.50], [47.80, 35.10], [46.50, 32.50], [42.00, 33.50], [42.00, 28.00], [70.0, 28.0]],
      6: [[70.0, 27.8], [59.40, 27.80], [57.00, 27.00], [55.00, 28.00], [53.00, 28.50], [51.00, 27.00], [48.50, 25.50], [42.00, 28.00], [42.00, 25.00], [70.0, 25.0]]
    };

    const TIMELINE_SNAPSHOTS = [
      { date: '1939-09-01', title: '1. Sept 1, 1939 — Outbreak of WWII in Europe', description: 'Germany invades Poland. Western Allies declare war.', baseControl: { DEU: 'axis', POL: 'axis', FRA: 'allied', GBR: 'allied' } },
      { date: '1940-06-15', title: '2. June 15, 1940 — Fall of France', description: 'Wehrmacht occupies France, Low Countries, Denmark, and Norway.', baseControl: { DEU: 'axis', POL: 'axis', BEL: 'axis', NLD: 'axis', DNK: 'axis', NOR: 'axis', FRA: 'axis', ITA: 'axis', AUT: 'axis', GBR: 'allied' } },
      { date: '1941-06-22', title: '3. June 22, 1941 — Operation Barbarossa Launch', description: 'Axis forces invade USSR. Frontline pushes past the Western border.', baseControl: { DEU: 'axis', POL: 'axis', FRA: 'axis', BEL: 'axis', NLD: 'axis', DNK: 'axis', NOR: 'axis', AUT: 'axis', HUN: 'axis', ROU: 'axis', BGR: 'axis', GRC: 'axis', YUG: 'axis', ITA: 'axis', FIN: 'axis', GBR: 'allied', RUS: 'allied', BLR: 'axis', UKR: 'axis', EST: 'axis', LVA: 'axis', LTU: 'axis', MDA: 'axis' } },
      { date: '1941-12-05', title: '4. Dec 5, 1941 — Peak Axis Penetration into Russia', description: 'Wehrmacht reaches Leningrad ring, Moscow outskirts, and Rostov.', baseControl: { DEU: 'axis', POL: 'axis', FRA: 'axis', BEL: 'axis', NLD: 'axis', DNK: 'axis', NOR: 'axis', AUT: 'axis', HUN: 'axis', ROU: 'axis', BGR: 'axis', GRC: 'axis', YUG: 'axis', ITA: 'axis', FIN: 'axis', GBR: 'allied', RUS: 'allied', BLR: 'axis', UKR: 'axis', EST: 'axis', LVA: 'axis', LTU: 'axis', MDA: 'axis' } },
      { date: '1942-11-18', title: '5. Nov 18, 1942 — Battle of Stalingrad & Caucasus Push', description: 'Axis forces reach Stalingrad on the Volga River and enter the Caucasus.', baseControl: { DEU: 'axis', POL: 'axis', FRA: 'axis', BEL: 'axis', NLD: 'axis', DNK: 'axis', NOR: 'axis', AUT: 'axis', HUN: 'axis', ROU: 'axis', BGR: 'axis', GRC: 'axis', YUG: 'axis', ITA: 'axis', FIN: 'axis', GBR: 'allied', RUS: 'allied', BLR: 'axis', UKR: 'axis', EST: 'axis', LVA: 'axis', LTU: 'axis', MDA: 'axis' } },
      { date: '1943-12-01', title: '6. Dec 1, 1943 — Soviet Dnieper River Offensives', description: 'Red Army pushes Axis troops back across Ukraine and Belarus.', baseControl: { DEU: 'axis', POL: 'axis', FRA: 'axis', BEL: 'axis', NLD: 'axis', DNK: 'axis', NOR: 'axis', AUT: 'axis', HUN: 'axis', ROU: 'axis', BGR: 'axis', GRC: 'axis', YUG: 'axis', FIN: 'axis', ITA: 'allied', GBR: 'allied', RUS: 'allied', BLR: 'axis', EST: 'axis', LVA: 'axis', LTU: 'axis', MDA: 'axis' } },
      { date: '1944-06-06', title: '7. June 6, 1944 — D-Day Normandy Landings', description: 'Western Allies land in Normandy; Eastern Front sits near Baltic borders.', baseControl: { DEU: 'axis', POL: 'axis', FRA: 'axis', BEL: 'axis', NLD: 'axis', DNK: 'axis', NOR: 'axis', AUT: 'axis', HUN: 'axis', ROU: 'axis', BGR: 'axis', GRC: 'axis', YUG: 'axis', FIN: 'axis', ITA: 'allied', GBR: 'allied', RUS: 'allied', BLR: 'axis', EST: 'axis', LVA: 'axis', LTU: 'axis', MDA: 'axis' } },
      { date: '1944-08-25', title: '8. Aug 25, 1944 — Liberation of Soviet Lands', description: 'Axis forces driven completely out of Soviet territory.', baseControl: { DEU: 'axis', NLD: 'axis', DNK: 'axis', NOR: 'axis', AUT: 'axis', HUN: 'axis', GRC: 'axis', POL: 'allied', FRA: 'allied', BEL: 'allied', ROU: 'allied', BGR: 'allied', YUG: 'allied', ITA: 'allied', GBR: 'allied', RUS: 'allied', UKR: 'allied', BLR: 'allied', EST: 'allied', LVA: 'allied', LTU: 'allied', MDA: 'allied' } },
      { date: '1945-05-08', title: '9. May 8, 1945 — Victory in Europe (V-E Day)', description: 'Nazi Germany surrenders unconditionally.', baseControl: { DEU: 'allied', POL: 'allied', FRA: 'allied', BEL: 'allied', NLD: 'allied', DNK: 'allied', NOR: 'allied', AUT: 'allied', HUN: 'allied', ROU: 'allied', BGR: 'allied', GRC: 'allied', YUG: 'allied', ITA: 'allied', GBR: 'allied', RUS: 'allied', UKR: 'allied', BLR: 'allied', EST: 'allied', LVA: 'allied', LTU: 'allied', MDA: 'allied' } }
    ];

    const FACTION_COLORS = { axis: '#ef4444', allied: '#3b82f6', neutral: '#475569' };

    const map = L.map('map').setView([58.0, 45.0], 3);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Canvas Dark Gray'
    }).addTo(map);

    let geoJsonLayer = null;
    let occupiedPolygonLayer = null;
    let geoJsonData = null;

    fetch('https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.0.0/geojson/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(data => {
        geoJsonData = data;
        updateMap(3);
      });

    function getFaction(properties, snapshot) {
      if (!properties) return 'neutral';
      const possibleKeys = [properties.ISO_A3, properties.ISO_A3_EH, properties.NAME, properties.ADMIN];
      for (const key of possibleKeys) {
        if (key && snapshot.baseControl[key]) return snapshot.baseControl[key];
      }
      return 'neutral';
    }

    function updateMap(index) {
      const snapshot = TIMELINE_SNAPSHOTS[index];
      
      document.getElementById('stage-title').innerText = snapshot.title;
      document.getElementById('stage-desc').innerText = snapshot.description;
      document.getElementById('stage-counter').innerText = `Stage ${index + 1} of ${TIMELINE_SNAPSHOTS.length}`;
      document.getElementById('stage-date').innerText = snapshot.date;

      if (geoJsonLayer) map.removeLayer(geoJsonLayer);
      if (occupiedPolygonLayer) map.removeLayer(occupiedPolygonLayer);

      if (geoJsonData) {
        geoJsonLayer = L.geoJSON(geoJsonData, {
          style: (feature) => {
            const faction = getFaction(feature.properties, snapshot);
            return {
              fillColor: FACTION_COLORS[faction],
              weight: 0.8,
              opacity: 1,
              color: '#0f172a',
              fillOpacity: faction === 'neutral' ? 0.35 : 0.85
            };
          },
          onEachFeature: (feature, layer) => {
            const name = feature.properties?.NAME || feature.properties?.ADMIN || 'Region';
            const faction = getFaction(feature.properties, snapshot).toUpperCase();
            layer.bindTooltip(`<b>${name}</b><br/>Control: ${faction}`, { sticky: true });
          }
        }).addTo(map);
      }

      const occupiedCoords = SOVIET_OCCUPIED_POLYGONS[index];
      if (occupiedCoords) {
        occupiedPolygonLayer = L.polygon(occupiedCoords, {
          color: '#991b1b',
          fillColor: '#ef4444',
          fillOpacity: 0.85,
          weight: 1.5
        }).addTo(map);
      }
    }

    document.getElementById('snapshot-slider').addEventListener('input', (e) => {
      updateMap(parseInt(e.target.value));
    });
  </script>
</body>
</html>
