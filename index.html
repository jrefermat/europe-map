<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Europe Pre/Post WWI Map</title>
  <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #slider-container {
      position: absolute; bottom: 30px; left: 10%; width: 80%;
      background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 8px;
      font-family: sans-serif; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 10;
    }
    #year-slider { width: 100%; cursor: pointer; }
    #era-title { margin: 5px 0 0 0; font-weight: normal; color: #555; }
  </style>
</head>
<body>

<div id="map"></div>
<div id="slider-container">
  <h2>Year: <span id="year-display">1910</span></h2>
  <h3 id="era-title">Pre-WWI Europe (German, Austro-Hungarian & Russian Empires)</h3>
  <input id="year-slider" type="range" min="1910" max="1920" step="1" value="1910">
</div>

<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      'version': 8,
      'sources': {
        // Pre-WWI Layer (Historical Map Style)
        'map-1914': {
          'type': 'raster',
          'tiles': [
            'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'
          ],
          'tileSize': 256
        },
        // Post-WWI Layer (Satellite/Physical Terrain Style)
        'map-1919': {
          'type': 'raster',
          'tiles': [
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
          ],
          'tileSize': 256
        }
      },
      'layers': [
        {
          'id': 'layer-1914',
          'type': 'raster',
          'source': 'map-1914',
          'paint': { 'raster-opacity': 1 }
        },
        {
          'id': 'layer-1919',
          'type': 'raster',
          'source': 'map-1919',
          'paint': { 'raster-opacity': 0 }
        }
      ]
    },
    center: [15.0, 50.0],
    zoom: 4
  });

  const slider = document.getElementById('year-slider');
  const yearDisplay = document.getElementById('year-display');
  const eraTitle = document.getElementById('era-title');

  slider.addEventListener('input', (e) => {
    const selectedYear = parseInt(e.target.value, 10);
    yearDisplay.textContent = selectedYear;

    if (selectedYear <= 1914) {
      // Show Pre-WWI Europe map
      map.setPaintProperty('layer-1914', 'raster-opacity', 1);
      map.setPaintProperty('layer-1919', 'raster-opacity', 0);
      eraTitle.textContent = "Pre-WWI Europe (German, Austro-Hungarian & Russian Empires)";
    } else {
      // Show Post-WWI Europe map
      map.setPaintProperty('layer-1914', 'raster-opacity', 0);
      map.setPaintProperty('layer-1919', 'raster-opacity', 1);
      eraTitle.textContent = "Post-WWI Europe (Borders Redrawn)";
    }
  });
</script>
</body>
</html>
